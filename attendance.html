<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance | Teacher Portal</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script></head><body><div class="shell"><aside class="side"><div class="brand"><img src="https://i.ibb.co/whtP8S5v/image.png"><b>LAFF BRITISH<br>MONTESSORI SCHOOL</b></div><nav class="nav"></nav></aside><main class="main"><header class="top"><div><span class="eyebrow">TEACHER PORTAL</span><h1>Attendance</h1><p>Record attendance only for students in your assigned classes.</p></div><div class="userbox" id="teacher">Teacher</div></header><section class="card"><div class="formgrid"><div class="field"><label>Session</label><select id="session"></select></div><div class="field"><label>Class</label><select id="class"></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Action</label><button class="btn primary" id="load">Load Students</button></div></div></section><section class="section"><div class="card"><div id="msg" class="notice hidden"></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Student</th><th>Student ID</th><th>Status</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="btn primary" id="save">Save Attendance</button></div></div></section></main></div><script src="assets/sidebar.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let user,teacher,sessionId;function msg(t,b=false){$('msg').textContent=t;$('msg').classList.toggle('hidden',false);$('msg').style.background=b?'#feeceb':'#fff7d6';$('msg').style.color=b?'#b42318':'#765b00'}async function init(){const{data:{user:u}}=await db.auth.getUser();user=u;if(!u)return location.href='login.html';const{data:p}=await db.from('profiles').select('role,full_name,is_active').eq('id',u.id).single();if(!p?.is_active||p.role!=='TEACHER')return location.href='login.html';$('teacher').textContent=p.full_name||'Teacher';const{data:t}=await db.from('teachers').select('id').eq('user_id',u.id).single();if(!t)return msg('Teacher profile is not linked.',true);teacher=t;const{data:s,error}=await db.from('academic_sessions').select('id,name,is_current').order('starts_on',{ascending:false});if(error)return msg(error.message,true);$('session').innerHTML=s.map(x=>`<option value="${x.id}">${esc(x.name)}${x.is_current?' · Current':''}</option>`).join('');$('date').value=new Date().toISOString().slice(0,10);sessionId=u.id;await classes()}async function classes(){const{data,error}=await db.from('class_subjects').select('class_id,classes(id,name)').eq('teacher_id',teacher.id);if(error)return msg(error.message,true);$('class').innerHTML='<option value="">Select class</option>'+[...new Map((data||[]).map(x=>[x.class_id,x.classes])).values()].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}async function load(){if(!$('class').value||!$('date').value)return msg('Select a class and date first.',true);const{data:en,error}=await db.from('enrollments').select('id,student_id,students(student_id,first_name,middle_name,last_name)').eq('class_id',$('class').value).eq('session_id',$('session').value).eq('status','ACTIVE').order('created_at');if(error)return msg(error.message,true);const{data:old}=await db.from('attendance').select('enrollment_id,status,note').eq('attendance_date',$('date').value).in('enrollment_id',(en||[]).map(x=>x.id));const map=new Map((old||[]).map(x=>[x.enrollment_id,x]));$('rows').innerHTML=(en||[]).map((x,i)=>{const s=x.students||{},n=[s.first_name,s.middle_name,s.last_name].filter(Boolean).join(' '),a=map.get(x.id);return `<tr data-id="${x.id}"><td>${i+1}</td><td><b>${esc(n)}</b></td><td>${esc(s.student_id||x.student_id)}</td><td><select class="att"><option ${!a||a.status==='PRESENT'?'selected':''}>PRESENT</option><option ${a?.status==='ABSENT'?'selected':''}>ABSENT</option><option ${a?.status==='LATE'?'selected':''}>LATE</option><option ${a?.status==='EXCUSED'?'selected':''}>EXCUSED</option></select></td><td><input class="note" value="${esc(a?.note||'')}" placeholder="Optional note"></td></tr>`}).join('')}async function save(){const rows=[...document.querySelectorAll('#rows tr')];if(!rows.length)return msg('Load students first.',true);for(const r of rows){const payload={enrollment_id:r.dataset.id,attendance_date:$('date').value,status:r.querySelector('.att').value,note:r.querySelector('.note').value.trim(),recorded_by:user.id};const old=await db.from('attendance').select('id').eq('enrollment_id',r.dataset.id).eq('attendance_date',$('date').value).maybeSingle();const res=old.data?await db.from('attendance').update(payload).eq('id',old.data.id):await db.from('attendance').insert(payload);if(res.error)return msg(res.error.message,true)}msg('Attendance saved successfully.')}$('load').onclick=load;$('save').onclick=save;$('session').onchange=classes;init();</script></body></html>
