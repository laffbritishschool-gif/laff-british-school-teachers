<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements | Teacher Portal</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script></head><body><div class="shell"><aside class="side"><div class="brand"><img src="https://i.ibb.co/whtP8S5v/image.png"><b>LAFF BRITISH<br>MONTESSORI SCHOOL</b></div><nav class="nav"></nav></aside><main class="main"><header class="top"><div><span class="eyebrow">TEACHER PORTAL</span><h1>Announcements</h1><p>School announcements and notices available to teaching staff.</p></div><div class="userbox" id="teacher">Teacher</div></header><section class="section"><div class="card"><div id="list"><div class="empty">Loading announcements…</div></div></div></section></main></div><script src="assets/sidebar.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function init(){const{data:{user}}=await db.auth.getUser();if(!user)return location.href='login.html';const{data:p}=await db.from('profiles').select('role,full_name,is_active').eq('id',user.id).single();if(!p?.is_active||p.role!=='TEACHER')return location.href='login.html';$('teacher').textContent=p.full_name||'Teacher';const{data,error}=await db.from('announcements').select('id,title,body,audience,published_at,created_at,classes(name)').eq('published',true).in('audience',['ALL','TEACHERS','CLASS']).order('published_at',{ascending:false});if(error){$('list').innerHTML='<div class="empty">Unable to load announcements.</div>';return}const rows=data||[];$('list').innerHTML=rows.length?rows.map(a=>`<article class="card" style="margin-bottom:12px"><span class="pill">${esc(a.audience)}</span><h2>${esc(a.title)}</h2><p class="muted" style="white-space:pre-wrap">${esc(a.body)}</p><small class="muted">${a.published_at?new Date(a.published_at).toLocaleString():'Published'}</small></article>`).join(''):'<div class="empty">No announcements at the moment.</div>'}init();</script></body></html>
