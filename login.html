<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Login | Laff British Montessori School</title>
  <meta name="description" content="Secure Laff British Montessori School teacher portal login using your registered school email and LBS school ID.">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase.js"></script>
</head>
<body class="login">
  <main class="loginbox">
    <img src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School">
    <div class="eyebrow" style="display:flex;width:max-content;margin:0 auto 10px">LBS Teacher Access</div>
    <h1>Teacher Portal</h1>
    <p id="intro">Sign in with your registered school email and LBS school ID.</p>

    <form id="signForm">
      <div class="field">
        <label for="email">School Email</label>
        <input id="email" type="email" required autocomplete="email" placeholder="teacher@school.com">
      </div>
      <div class="field">
        <label for="schoolId">LBS School ID</label>
        <input id="schoolId" required autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. LBS001">
      </div>
      <button id="signButton" class="btn primary" type="submit">Sign in securely</button>
      <p class="hint" style="margin-top:12px">Use the school email already registered by the school and your assigned LBS school ID.</p>
      <p id="signMsg" style="margin-top:14px"></p>
    </form>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    function message(text, ok = false) {
      $('signMsg').textContent = text;
      $('signMsg').style.color = ok ? '#087443' : '#b42318';
    }

    $('signForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('email').value.trim().toLowerCase();
      const school_id = $('schoolId').value.trim().toUpperCase();
      if (!email || !school_id) return;

      $('signButton').disabled = true;
      $('signButton').textContent = 'Checking details…';
      message('Verifying your school email and LBS school ID…', true);

      const { data, error } = await db.functions.invoke('teacher-login', {
        body: { email, school_id }
      });

      if (error || !data?.action_link) {
        $('signButton').disabled = false;
        $('signButton').textContent = 'Sign in securely';
        message(data?.error || error?.message || 'Unable to sign you in. Check your school email and LBS school ID.');
        return;
      }

      message('Details verified. Opening your secure teacher workspace…', true);
      window.location.replace(data.action_link);
    });
  </script>
</body>
</html>
