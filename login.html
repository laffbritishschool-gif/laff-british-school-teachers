<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script></head><body class="login"><main class="loginbox"><img src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><h1>Teacher Portal</h1><p id="intro">Sign in with your school email and password.</p><div class="tabs" style="display:flex;gap:8px;margin:18px 0"><button id="signTab" class="btn primary" type="button">Sign in</button><button id="setupTab" class="btn" type="button">First-time setup</button></div><section id="signin"><form id="signForm"><div class="field"><label>School email</label><input id="signEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="signPassword" type="password" required autocomplete="current-password"></div><button class="btn primary" type="submit">Sign in securely</button><button id="forgot" class="btn" type="button" style="margin-top:10px;width:100%">Forgot password?</button><p id="signMsg" style="margin-top:14px"></p></form></section><section id="setup" hidden><form id="startForm"><div class="field"><label>School email</label><input id="setupEmail" type="email" required autocomplete="email" placeholder="yourname@school.com"></div><button class="btn primary" type="submit">Send verification code</button><p class="hint" style="margin-top:12px">Use the email already registered by the school. We will send a one-time verification code before you create your password.</p><p id="startMsg"></p></form><form id="verifyForm" hidden><div class="field"><label>Verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required></div><div class="field"><label>Create password</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary" type="submit">Create password & enter portal</button><p id="verifyMsg"></p></form></section></main><script>
const $=id=>document.getElementById(id); const show=(id,on)=>$(id).hidden=!on;
function message(id,text,ok=false){$(id).textContent=text;$(id).style.color=ok?'#087443':'#b42318'}
$('signTab').onclick=()=>{show('signin',true);show('setup',false);$('signTab').className='btn primary';$('setupTab').className='btn'};
$('setupTab').onclick=()=>{show('signin',false);show('setup',true);$('setupTab').className='btn primary';$('signTab').className='btn'};
$('signForm').addEventListener('submit',async e=>{e.preventDefault();message('signMsg','Signing in…',true);const{error}=await db.auth.signInWithPassword({email:$('signEmail').value.trim(),password:$('signPassword').value});if(error){message('signMsg',error.message);return}location.href='index.html'});
$('forgot').onclick=async()=>{const email=$('signEmail').value.trim();if(!email){message('signMsg','Enter your school email first.');return}message('signMsg','Sending password recovery email…',true);const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)message('signMsg',error.message);else message('signMsg','Check your email for the password recovery link.',true)};
$('startForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('setupEmail').value.trim().toLowerCase();message('startMsg','Checking your teacher record and sending a verification code…',true);const{data,error}=await db.functions.invoke('teacher-start-onboarding',{body:{email}});if(error){message('startMsg',error.message);return}if(data?.already_linked){message('startMsg',data.error);return}message('startMsg',data?.message||'Verification code sent.',true);show('verifyForm',true);$('setupEmail').readOnly=true;$('otp').focus()});
$('verifyForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('setupEmail').value.trim().toLowerCase(),token=$('otp').value.trim(),password=$('newPassword').value,confirm=$('confirmPassword').value;if(password.length<8){message('verifyMsg','Password must be at least 8 characters.');return}if(password!==confirm){message('verifyMsg','Passwords do not match.');return}message('verifyMsg','Verifying email and creating your secure password…',true);const{data,error}=await db.auth.verifyOtp({email,token,type:'email'});if(error){message('verifyMsg',error.message);return}const{error:pwError}=await db.auth.updateUser({password});if(pwError){message('verifyMsg',pwError.message);return}const{data:done,error:doneError}=await db.functions.invoke('teacher-complete-onboarding');if(doneError||done?.error){message('verifyMsg',done?.error||doneError?.message||'Could not finish account setup.');return}location.href='index.html'});
</script></body></html>
