<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Login | Laff British Montessori School</title>
  <meta name="description" content="Secure Laff British Montessori School teacher portal login using your registered school email and LBS school ID.">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase.js"></script>
</head>
<body class="login">
  <main class="loginbox">
    <img src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School">
    <div class="eyebrow" style="display:flex;width:max-content;margin:0 auto 10px">LBS Teacher Access</div>
    <h1>Teacher Portal</h1>
    <p id="intro">Sign in with your registered school email and LBS school ID.</p>

    <form id="signForm">
      <div class="field">
        <label for="email">School Email</label>
        <input id="email" type="email" required autocomplete="email" placeholder="teacher@laffbritishmontesorrischool.com">
      </div>
      <div class="field">
        <label for="schoolId">Staff ID</label>
        <input id="schoolId" required autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. TCH-123456">
      </div>
      <div class="field" id="codeField" hidden>
        <label for="code">Confirmation Code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter the 6-digit code">
      </div>
      <button id="signButton" class="btn primary" type="submit">Sign in securely</button>
      <p class="hint" id="loginHint" style="margin-top:12px">Use your School Email and Staff ID. If confirmation is required, a 6-digit code will be emailed before dashboard access.</p>
      <p id="signMsg" style="margin-top:14px"></p>
    </form>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let awaitingConfirmation = false;

    function message(text, ok = false) {
      $('signMsg').textContent = text;
      $('signMsg').style.color = ok ? '#087443' : '#b42318';
    }

    async function getTeacher(email, schoolId) {
      const { data, error } = await db
        .from('teachers')
        .select('id,user_id,staff_id,full_name,school_email,email,is_active,email_confirmation_mode,email_confirmed')
        .eq('staff_id', schoolId)
        .maybeSingle();

      if (error) throw new Error('Unable to check the teacher account.');
      if (!data || !data.is_active || (data.school_email || data.email || '').trim().toLowerCase() !== email) {
        throw new Error('The School Email and Staff ID do not match an active teacher account.');
      }
      return data;
    }

    $('signForm').addEventListener('submit', async e => {
      e.preventDefault();

      const email = $('email').value.trim().toLowerCase();
      const schoolId = $('schoolId').value.trim().toUpperCase();
      const verification = $('code').value.trim();

      if (!email || !schoolId) return;

      $('signButton').disabled = true;
      $('signButton').textContent = awaitingConfirmation ? 'Verifying code…' : 'Checking details…';

      try {
        const teacher = await getTeacher(email, schoolId);

        if (!teacher.user_id) {
          throw new Error('Your teacher account has not been prepared yet. Please contact the school administrator.');
        }

        const mode = String(teacher.email_confirmation_mode || 'TEACHER').toUpperCase();

        if (mode === 'ADMIN' && !teacher.email_confirmed) {
          throw new Error('Your account is awaiting administrator confirmation.');
        }

        if (mode !== 'AUTO' && !teacher.email_confirmed && !verification) {
          const { error } = await db.auth.signInWithOtp({
            email,
            options: { shouldCreateUser: false }
          });

          if (error) throw new Error(error.message);

          awaitingConfirmation = true;
          $('codeField').hidden = false;
          $('code').focus();
          message('A 6-digit confirmation code has been sent to your School Email.', false);
          $('signButton').disabled = false;
          $('signButton').textContent = 'Verify code';
          return;
        }

        if (mode !== 'AUTO' && !teacher.email_confirmed) {
          const { data: verified, error } = await db.auth.verifyOtp({
            email,
            token: verification,
            type: 'email'
          });

          if (error || !verified?.user) {
            throw new Error(error?.message || 'That confirmation code is invalid or expired.');
          }

          if (verified.user.id !== teacher.user_id) {
            await db.auth.signOut();
            throw new Error('The confirmation code does not belong to this teacher account.');
          }

          const { error: updateError } = await db
            .from('teachers')
            .update({
              email_confirmed: true,
              onboarding_status: 'READY',
              email_confirmation_code_hash: null,
              email_confirmation_expires_at: null
            })
            .eq('id', teacher.id);

          if (updateError) throw new Error('The account could not be confirmed.');

          // Keep the verified Supabase session for the dashboard.
          message('Confirmation successful. Opening your dashboard…', true);
          window.location.replace('index.html');
          return;
        }

        // AUTO-confirmed accounts still need a browser session. The teacher account
        // must already have an Auth session, otherwise ask the admin to provision it.
        const { data: sessionData } = await db.auth.getSession();
        if (!sessionData?.session) {
          throw new Error('Your teacher account is confirmed, but its sign-in session is not ready. Please ask the administrator to provision the account again.');
        }

        message('Login successful. Opening your dashboard…', true);
        window.location.replace('index.html');
      } catch (err) {
        message(err?.message || 'Unable to sign you in.');
        $('signButton').disabled = false;
        $('signButton').textContent = awaitingConfirmation ? 'Verify code' : 'Sign in securely';
      }
    });
  </script>dy>
</html>
