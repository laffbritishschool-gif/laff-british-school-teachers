<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script></head><body class="login"><main class="loginbox"><img src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><h1>Teacher Portal</h1><p>Sign in to enter and submit student results.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" type="submit">Sign in securely</button><p id="msg" style="margin-top:14px"></p></form></main><script>form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.href='index.html'});</script></body></html>
