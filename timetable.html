<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Timetable | Teacher Portal</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script></head><body><div class="shell"><aside class="side"><div class="brand"><img src="https://i.ibb.co/whtP8S5v/image.png"><b>LAFF BRITISH<br>MONTESSORI SCHOOL</b></div><nav class="nav"></nav></aside><main class="main"><header class="top"><div><span class="eyebrow">TEACHER PORTAL</span><h1>My Timetable</h1><p>View the timetable for your assigned classes and subjects.</p></div><div class="userbox" id="teacher">Teacher</div></header><section class="card"><div class="toolbar"><div class="field"><label>Session</label><select id="session"></select></div><div class="field"><label>Term</label><select id="term"></select></div><div class="field"><label>Class</label><select id="class"></select></div><button class="btn primary" id="load">Load Timetable</button></div></section><section class="section"><div class="card"><div class="section-head"><div><span class="eyebrow">WEEKLY SCHEDULE</span><h2>Teaching timetable</h2></div></div><div id="msg" class="notice hidden"></div><div id="calendar" class="calendar"></div></div></section></main></div><script src="assets/sidebar.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let teacher,assignments=[],sessions=[],terms=[];function show(m){$('msg').textContent=m;$('msg').classList.remove('hidden')}async function init(){const{data:{user}}=await db.auth.getUser();if(!user)return location.href='login.html';const{data:p}=await db.from('profiles').select('role,full_name,is_active').eq('id',user.id).single();if(!p?.is_active||p.role!=='TEACHER')return location.href='login.html';$('teacher').textContent=p.full_name||'Teacher';const{data:t}=await db.from('teachers').select('id').eq('user_id',user.id).single();if(!t)return show('Teacher profile is not linked.');teacher=t;const[s,tr,a]=await Promise.all([db.from('academic_sessions').select('id,name,is_current').order('starts_on',{ascending:false}),db.from('terms').select('id,session_id,name,is_current').order('name'),db.from('class_subjects').select('class_id,subject_id,classes(id,name),subjects(id,name)').eq('teacher_id',t.id)]);if(s.error||tr.error||a.error)return show((s.error||tr.error||a.error).message);sessions=s.data||[];terms=tr.data||[];assignments=a.data||[];$('session').innerHTML=sessions.map(x=>`<option value="${x.id}">${esc(x.name)}${x.is_current?' · Current':''}</option>`).join('');$('term').innerHTML=terms.filter(x=>x.session_id===sessions.find(y=>y.is_current)?.id).map(x=>`<option value="${x.id}">${esc(x.name.replace('_',' '))}</option>`).join('');$('class').innerHTML='<option value="">All assigned classes</option>'+[...new Map(assignments.map(x=>[x.class_id,x.classes])).values()].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');load()}async function load(){const sid=$('session').value,tid=$('term').value,cid=$('class').value;const ids=assignments.filter(x=>!cid||x.class_id===cid).map(x=>x.subject_id);if(!ids.length){$('calendar').innerHTML='<div class="empty">No assigned classes or subjects.</div>';return}let q=db.from('timetables').select('day_of_week,start_time,end_time,room,subject_id,teacher_id,classes(name),subjects(name)').eq('session_id',sid).eq('term_id',tid).in('subject_id',ids).order('day_of_week').order('start_time');if(cid)q=q.eq('class_id',cid);const{data,error}=await q;if(error)return show(error.message);const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];$('calendar').innerHTML=days.map((day,i)=>{const rows=(data||[]).filter(x=>Number(x.day_of_week)===i+1);return `<div class="day"><b>${day}</b>${rows.length?rows.map(x=>`<div class="lesson"><b>${esc(x.subjects?.name||'Subject')}</b><span>${esc(x.start_time||'')} – ${esc(x.end_time||'')}</span><small>${esc(x.classes?.name||'')} ${x.room?' · '+esc(x.room):''}</small></div>`).join(''):'<p class="muted small">No lesson</p>'}</div>`}).join('')}$('session').onchange=()=>{$('term').innerHTML=terms.filter(x=>x.session_id===$('session').value).map(x=>`<option value="${x.id}">${esc(x.name.replace('_',' '))}</option>`).join('');load()};$('term').onchange=load;$('class').onchange=load;$('load').onclick=load;init();</script></body></html>
